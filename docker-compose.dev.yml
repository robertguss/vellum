services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./deploy/dex-config.yaml:/etc/dex/config.yaml:ro

  s3:
    image: ghcr.io/versity/versitygw:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/buckets/vellum-uploads && exec versitygw --port :9000 --health /health --access vellum --secret vellum-dev-secret-key --region us-east-1 posix --nometa /data/buckets
    ports:
      - "9000:9000"
    volumes:
      - s3_data:/data

volumes:
  s3_data:
