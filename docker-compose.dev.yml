services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./deploy/dex-config.yaml:/etc/dex/config.yaml:ro

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: vellum
      MINIO_ROOT_PASSWORD: vellum-dev-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 vellum vellum-dev-secret-key; do sleep 1; done;
      mc mb --ignore-existing local/vellum-uploads;
      mc anonymous set none local/vellum-uploads;
      "

volumes:
  minio_data:
